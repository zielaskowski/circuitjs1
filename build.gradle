// updated to Gradle 9.7.0 (as of 2026)

// 1. Run Gradle build with verbose output:
// gradle gwtCompile --console verbose --info
// 2. Create the web-site directory from the build files:
// gradle makeSite --console verbose --info
// 3. To cleanup and remove the target, build and site directories
// gradle cleanUp



plugins {
    id 'java'
    id "org.docstr.gwt" version "2.2.9"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.gwtproject:gwt:2.13.1"
    implementation "org.gwtproject:gwt-dev:2.13.1"
    implementation "org.gwtproject:gwt-user:2.13.1"
}

// need this to find circuitjs1.gwt.xml
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}


group = 'com.lushprojects.circuitjs1'
version = '9.7.0'

//---------------------------------------------------------------------
// Setting File and Directory Locations
//---------------------------------------------------------------------
// [1] https://docs.gradle.org/current/userguide/working_with_files.html

File siteDir = file('site')

//---------------------------------------------------------------------
// Custom Tasks (for "circuitjs1" project)
//---------------------------------------------------------------------
// NOTE:
//    [1] These are executed immediately unless you skip "up-to-date"
//        check by using explicit something() method inside doLast{}.
//        That means we don't need to write: cleanUp(type: Delete).
//    [2] There is a bug in 'gwt-gradle-plugin' that create empty build
//        directories already in the configuration phase. So any task
//        that is ran, will create these. See:
//        https://github.com/jiakuan/gwt-gradle-plugin/issues/25
//---------------------------------------------------------------------
task cleanUp {
    group 'circuitjs1'
    description 'Delete Gradle created ./build and ./site directories.'
    doLast {
        delete {
            println "\nCleaning up Gradle built directories and artifacts..."
            println " - Deleting build directory:  $buildDir"
            delete buildDir
            println " - Deleting site directory:   $siteDir"
            delete siteDir
            //println " - Deleting target directory: $siteDir"
            //delete targetDir
            println "Done\n"
        }
    }
}

tasks.register('makeSite', Copy) {
    group 'circuitjs1'
    description 'Copy circuitjs resources to ./site, using fresh GWT output'

    dependsOn gwtCompile  // Ensures fresh compile first

    into 'site'

    // Copy static files from war/ (HTML entry point, any other assets, but exclude stale GWT dir)
    from('war') {
        include '**/*.html'
        include '**/*.css'
        include 'canvas2svg.js'
        include 'service-worker.js'
        include 'lz-string.min.js'
        include '**/*.png', '**/*.jpg', '**/*.gif', '**/*.svg'
        include '**/*.txt', '**/*.xml'  // e.g. setuplist.txt if here
        include 'font/**'
        // Importantly: exclude the old GWT module dir to avoid overwriting with stub
        exclude 'circuitjs1/**'
        // exclude 'WEB-INF/**' if needed
    }

    // Copy the PRODUCTION GWT output (this is the key part)
    from('build/gwt/war/circuitjs1') {
        into 'circuitjs1'  // Places contents directly into site/circuitjs1/
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE  // Prefer first source if any overlap

    def execOps = services.get(ExecOperations)
    doLast {
        println "makeSite done. Checking site/circuitjs1:"
        execOps.exec {
            commandLine 'ls', '-la', 'site/circuitjs1'
        }
    }
}


//---------------------------------------------------------------------
// "system" related tasks
//---------------------------------------------------------------------
task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from(sourceSets.main.allJava)
}

tasks.withType(Test) {
    //maxParallelForks = 4              // 4
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1     // Use: #CPUs/2 | 4
    reports.html.required.set(true)         // Enable HTML report
    reports.junitXml.required.set(false)    // Disable JUnit XML report
}

tasks.withType(JavaCompile) {
    options.fork = true                 //
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-Xdoclint:none',               //
        '-Xlint:none',                  //
        '-nowarn',                      //
        //'-Xlint:unchecked'            //
    ]
}

//=====================================================================
// Plugin Configurations
//=====================================================================
gwt {
    gwtVersion = '2.12.1'
    minHeapSize = "512M"                // -Xms512M
    maxHeapSize = "1024M"               // -Xmx1024M
    logLevel = 'INFO'                   // -logLevel INFO  / [ERROR,WARN,INFO,TRACE,DEBUG,SPAM,ALL]
    modules = ['com.lushprojects.circuitjs1.circuitjs1']
}

